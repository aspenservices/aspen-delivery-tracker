<!--
  ===========================================================================
  ASPEN SPAS - DELIVERY PREPARATION (portal del cliente)      build 75-portal
  ===========================================================================
  Esta pagina la abre el CLIENTE desde el link que se le manda por mensaje.

  ANTES: prep.html era una copia del index ENTERO - 859 KB, el app de
  administracion completo, y congelada en el build 57 del 5 de julio. Eso no
  era solo peso: el arreglo de la caducidad de 21 dias del 21 de julio se hizo
  en index.html y NUNCA llego aqui, asi que en produccion los links seguian
  sin caducar. Se arreglaba en un archivo y el cliente abria el otro.

  AHORA: solo el portal. 24 KB de codigo, sacado del index build 75, con el
  arreglo de la caducidad dentro. Nada de lista de usuarios, calendario,
  metricas ni pantallas de admin.

  PARA MANTENERLO: el codigo del portal vive AQUI. Las funciones _portal* que
  quedan dentro de index.html ya no las abre nadie - si hay que cambiar algo
  del portal, se cambia en este archivo.
  ===========================================================================
-->

<!-- Sin SDK de Firebase, a proposito. Ver la nota de la cabecera. -->
<script>
var PORTAL_BUILD='80-linkfix';
console.log('%c[PORTAL] Aspen Delivery Prep build '+PORTAL_BUILD,'color:#fff;background:#0f766e;padding:2px 6px;border-radius:3px');

var PORTAL_GET_FN  ="https://us-central1-aspen-delivery-tracker.cloudfunctions.net/portalGet";
var PORTAL_POST_FN ="https://us-central1-aspen-delivery-tracker.cloudfunctions.net/portalSubmit";
var _PID="", _PTOK="";

/* POST con reintentos y espera creciente. Un bache de cobertura en el patio de
   un cliente no puede perder una foto sin avisar. */
function pPost(body,tries){
  tries=tries||3;
  return new Promise(function(resolve,reject){
    var k=0;
    (function go(){
      k++;
      var ctl=(typeof AbortController!=="undefined")?new AbortController():null;
      var timer=setTimeout(function(){try{ctl&&ctl.abort()}catch(_e){}},45000);
      fetch(PORTAL_POST_FN,{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify(Object.assign({id:_PID,t:_PTOK},body)),
            signal:ctl?ctl.signal:undefined})
      .then(function(r){clearTimeout(timer);return r.json().then(function(j){
        if(!r.ok||!j||j.ok!==true)throw new Error((j&&j.error)||("HTTP "+r.status));return j})})
      .then(resolve)
      .catch(function(e){clearTimeout(timer);
        if(k<tries)setTimeout(go,250*Math.pow(2,k-1)); else reject(e)});
    })();
  });
}

var _PORTAL=null;

/* ---------- codigo del portal, identico al del index build 75 ---------- */
function getIntakeParams(){
function parse(str){let o={};(str||'').replace(/^[#?]/,'').split('&').forEach(p=>{let i=p.indexOf('=');if(i>0)o[decodeURIComponent(p.slice(0,i))]=decodeURIComponent(p.slice(i+1))});return o}
let h=parse(location.hash),q=parse(location.search);
let id=h.intake||q.intake||h.i||q.i,t=h.t||q.t; /* BUILD 80: 'i' es el formato corto nuevo; 'intake' se mantiene para los links ya enviados */
return id?{id:String(id),token:t||''}:null}

function parseDate(dd){if(!dd)return null;let s=String(dd).trim();
let iso=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
if(iso)return new Date(+iso[1],+iso[2]-1,+iso[3]);
let clean=s.replace(/\s*(am|pm|all\s*day|all)\s*/gi,'').trim();
let mdy4=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(clean);
if(mdy4)return new Date(+mdy4[3],+mdy4[1]-1,+mdy4[2]);
let mdy2=/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/.exec(clean);
if(mdy2){let yr=+mdy2[3];yr=yr<50?2000+yr:1900+yr;return new Date(yr,+mdy2[1]-1,+mdy2[2])}
let md=/^(\d{1,2})\/(\d{1,2})$/.exec(clean);
if(md){let m=+md[1],d=+md[2];
// FIX #5 (build 60): the old rule ("month already passed → next year") made HISTORICAL
// M/D dates drift forward every month: by July 2026, "1/21" (a January 2026 delivery)
// parsed as January 2027 and the ticket reappeared as a phantom future delivery.
// New rule: consider lastYear/thisYear/nextYear and pick the candidate CLOSEST to today.
// If a delivered/complete flag is available (ctx), only past candidates are allowed.
let now=new Date();now.setHours(0,0,0,0);let curY=now.getFullYear();
let cands=[curY-1,curY,curY+1].map(y=>new Date(y,m-1,d)).filter(dt=>!isNaN(dt));
if(_parseDateCtxDelivered)cands=cands.filter(dt=>dt.getTime()<=now.getTime());
if(!cands.length)cands=[new Date(curY,m-1,d)];
cands.sort((a,b)=>Math.abs(a-now)-Math.abs(b-now));
return cands[0]}
return null}

function fmtDate(dd){let d=parseDate(dd);if(!d||isNaN(d))return String(dd||'TBD').replace(/[<>"]/g,'');
return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function _iesc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function _probeImg(u){return new Promise(function(done){
var im=new Image();var fin=false;
var t=setTimeout(function(){if(fin)return;fin=true;im.src='';done('unknown')},15000);
im.onload=function(){if(fin)return;fin=true;clearTimeout(t);done('alive')};
im.onerror=function(){if(fin)return;fin=true;clearTimeout(t);done('dead')};
im.src=u+(u.indexOf('?')>-1?'&':'?')+'pd='+Date.now()})}

async function compressImage(file,maxDim,quality){
file=await heicToJpegIfNeeded(file);
return new Promise((res,rej)=>{
let img=new Image();let url=URL.createObjectURL(file);
img.onload=function(){
let w=img.width,h=img.height;
if(w>maxDim||h>maxDim){let r=Math.min(maxDim/w,maxDim/h);w=Math.round(w*r);h=Math.round(h*r)}
let canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
let ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
URL.revokeObjectURL(url);
res(canvas.toDataURL('image/jpeg',quality||0.7))};
img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Could not load image'))};
img.src=url})}

async function heicToJpegIfNeeded(file){
if(!isHeicFile(file))return file;
try{
await ensureHeicLib();
let out=await window.heic2any({blob:file,toType:'image/jpeg',quality:0.9});
let blob=Array.isArray(out)?out[0]:out;
return blob||file;
}catch(e){console.warn('[HEIC] convert failed — passing original through:',e);return file}
}

/* Las fotos ya no van a Storage desde aqui: se mandan a la Cloud Function,
   que las sube con Admin SDK. Asi el navegador del cliente no necesita ninguna
   sesion, y en la Fase D se podran cerrar tambien las reglas de Storage.
   Si falla, la foto se conserva en base64 como antes: nunca se pierde. */
async function uploadPhotoToStorage(ticketId,b64){
  if(typeof b64!=='string'||b64.indexOf('data:')!==0)return b64;
  try{ var res=await pPost({kind:"photo",dataUrl:b64}); return (res&&res.url)?res.url:b64; }
  catch(e){ console.warn('[PORTAL] la foto no subio, se queda en base64:',e&&e.message); return b64; }
}

function showToast(msg,type){
// LOW FIX (build 62): rapid consecutive toasts used to overwrite each other (the first message
// vanished). Now up to 3 stack bottom-up, each with its own lifetime.
let stack=document.getElementById('toastStack');
if(!stack){stack=document.createElement('div');stack.id='toastStack';stack.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:99999;display:flex;flex-direction:column-reverse;gap:8px;align-items:center;pointer-events:none';document.body.appendChild(stack)}
while(stack.children.length>=3)stack.removeChild(stack.firstChild);
let t=document.createElement('div');t.className='toast show'+(type?' '+type:'');t.style.position='static';t.style.transform='none';t.innerHTML=msg;
stack.appendChild(t);
setTimeout(function(){t.classList.remove('show');setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},350)},2500)}

function _portalShell(inner){
return '<div style="min-height:100%;background:#eef2f6;padding:0 0 40px">'+
'<div style="background:#0f172a;color:#fff;padding:18px 16px;text-align:center"><div style="font-size:13px;letter-spacing:3px;color:var(--st-warning);font-weight:700">ASPEN SPAS</div><div style="font-size:18px;font-weight:700;margin-top:2px">Delivery Preparation</div></div>'+
'<div style="max-width:560px;margin:0 auto;padding:16px">'+inner+'</div></div>'}

function _portalMsg(title,sub){
return _portalShell('<div style="background:var(--surface);border-radius:14px;padding:30px 22px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08)"><div style="font-size:42px">&#128231;</div><div style="font-size:20px;font-weight:700;margin:10px 0 6px">'+_iesc(title)+'</div><div style="color:var(--ink-mid);font-size:14px;line-height:1.5">'+_iesc(sub)+'</div></div>')}

function _card(title,body){return '<div style="background:var(--surface);border-radius:14px;padding:16px 16px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)"><div style="font-weight:700;font-size:15px;color:var(--ink-strong);margin-bottom:8px">'+title+'</div>'+body+'</div>'}

function _photoField(group,hint){
return '<div style="font-size:13px;color:var(--ink-slate);line-height:1.5;margin-bottom:10px">'+hint+'</div>'+
'<input id="file_'+group+'" type="file" accept="image/*" multiple capture="environment" style="display:none" onchange="intakeFiles(this,\''+group+'\')">'+
'<button type="button" onclick="document.getElementById(\'file_'+group+'\').click()" style="background:#0f766e;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;width:100%;cursor:pointer">&#128247; Add photos</button>'+
'<div id="thumbs_'+group+'" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div>'}

function _pStar(n){
var card=document.getElementById('pRevCard');if(!card||!_PORTAL)return;
_PORTAL._stars=n;
var rvUrl=(_PORTAL.it&&_PORTAL.it.pinfo&&_PORTAL.it.pinfo.rvUrl)||'';
var h='<div style="font-size:22px;margin-bottom:6px">'+'\u2B50'.repeat(n)+'</div>';
if(n>=4&&rvUrl){
h+='<div style="font-weight:800;margin-bottom:8px">Thank you! Would you share it with others?</div>';
h+='<a href="'+_iesc(rvUrl)+'" target="_blank" rel="noopener" onclick="_pSendReview(null)" style="display:inline-block;background:#E54B25;color:#fff;font-weight:800;padding:10px 18px;border-radius:9px;text-decoration:none">\u2B50 Leave a Google review</a>';
h+='<div style="margin-top:8px"><a href="#" onclick="_pSendReview(null);return false" style="font-size:12px;color:var(--ink-mid)">Maybe later</a></div>';
}else{
h+='<div style="font-weight:800;margin-bottom:8px">'+(n>=4?'Thank you!':'We\u2019re sorry it wasn\u2019t perfect \u2014 tell us what happened:')+'</div>';
h+='<textarea id="pRevTxt" rows="3" placeholder="Your feedback goes straight to our service manager\u2026" style="width:100%;box-sizing:border-box;border:1.5px solid var(--hairline-2);border-radius:9px;padding:9px;font-family:inherit;font-size:14px"></textarea>';
h+='<button onclick="_pSendReview(document.getElementById(\'pRevTxt\').value)" style="margin-top:8px;background:#2F7D52;color:#fff;border:none;font-weight:800;padding:10px 18px;border-radius:9px;cursor:pointer">Send feedback</button>';
}
card.innerHTML=h}

function _pSendReview(txt){
if(!_PORTAL||!_PORTAL._stars)return;
var payload={stars:_PORTAL._stars,feedback:(txt&&String(txt).trim())||null,ts:Date.now()};
try{pPost({kind:"review",stars:payload.stars,feedback:payload.feedback}).catch(function(e){console.warn("[PORTAL] review",e)})}catch(e){}
_PORTAL.it.review=payload;
var card=document.getElementById('pRevCard');
if(card)card.innerHTML='<div style="font-size:20px">'+'\u2B50'.repeat(_PORTAL._stars)+'</div><div style="font-weight:700;margin-top:4px">Thank you for your feedback! \u{1F49A}</div>'}

function _intakeThumbs(group){
let c=document.getElementById('thumbs_'+group);if(!c)return;
c.innerHTML=_PORTAL[group].map((b,i)=>'<div style="position:relative"><img src="'+b+'" style="width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #ddd"><button type="button" onclick="_PORTAL.'+group+'.splice('+i+',1);_intakeThumbs(\''+group+'\')" style="position:absolute;top:-7px;right:-7px;background:var(--st-danger);color:#fff;border:0;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:22px;cursor:pointer">&times;</button></div>').join('')}

function _irespSummary(it){
let rp=it.resp||{},h='<div style="font-size:13px;line-height:1.6">';
if(rp.payment)h+='<div>&#128181; Payment: <b>'+_iesc(_ipayLabel(rp.payment))+'</b></div>';
if(typeof rp.levelOk!=='undefined')h+='<div>&#128208; Pad is level &amp; clear: <b>'+(rp.levelOk?'Yes':'No')+'</b></div>';
if(typeof rp.wipOk!=='undefined')h+='<div>&#128268; WIP ready (15ft conduit + adapters): <b>'+(rp.wipOk?'Yes':'No')+'</b></div>';
[['access','Access photos'],['levelPhotos','Pad / level'],['electricity','Breaker box'],['wipPhotos','WIP']].forEach(g=>{let arr=_intakeArr(rp[g[0]]);if(arr.length){h+='<div style="margin-top:6px"><b>'+g[1]+'</b> ('+arr.length+'):<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">'+arr.map(b=>{let u=safeUrl(b);if(!u)return'';return '<a href="'+u+'" target="_blank" rel="noopener"><img src="'+u+'" style="width:62px;height:62px;object-fit:cover;border-radius:6px;border:1px solid #ddd" onerror="_imgFail(this)"></a>'}).join('')+'</div></div>'}});
if(rp.notes)h+='<div style="margin-top:6px">&#128221; Customer notes: '+_iesc(rp.notes)+'</div>';
return h+'</div>'}

function _portalStatusHtml(it){
var p=it.pinfo||{};var h='';
var dd=p.dd||it.date||'';var dateStr=dd;
try{if(dd&&typeof fmtDate==='function')dateStr=fmtDate(dd)}catch(e){}
if(p.co||p.dl){
h+='<div style="background:#e7f8f0;border:1px solid #a7e3c6;border-radius:14px;padding:16px;margin-bottom:14px;text-align:center"><div style="font-size:26px">\u2705</div><div style="font-weight:800;font-size:16px;color:#166534">Your spa was delivered!</div><div style="font-size:13px;color:#166534;margin-top:4px">Thank you for choosing Aspen Spas. Enjoy!</div></div>';
try{h+=_portalReviewHtml(it)}catch(e){}
return h}
if(p.onway&&!p.dl&&(Date.now()-p.onway)<12*3600*1000){
h+='<div style="background:#0f766e;color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;text-align:center"><div style="font-size:22px">\u{1F69A}</div><div style="font-weight:800;font-size:15px">Your Aspen Spas crew is on the way!</div></div>';
}
if(dateStr){
h+=_card('\u{1F4C5} Your delivery',
'<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><div style="font-weight:800;font-size:17px">'+_iesc(dateStr)+'</div>'+
(p.slot?'<div style="font-size:12.5px;color:var(--ink-mid)">'+(p.slot==='AM'?'Morning (AM) window':p.slot==='PM'?'Afternoon (PM) window':'All-day window')+'</div>':'')+'</div>'+
(p.slot?'<span style="background:'+(p.slot==='PM'?'#E54B25':'#1C8FA8')+';color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:20px">'+_iesc(p.slot)+'</span>':'')+'</div>');
}
var chips=[];if(p.extra)chips.push('\u{1F465} Extra crew member');if(p.water)chips.push('\u{1F69B} Water truck');if(p.crane)chips.push('\u{1F3D7}\uFE0F Crane');
if(p.tech||chips.length){
h+=_card('\u{1F477} Your crew',
(p.tech?'<div style="font-size:14px;margin-bottom:'+(chips.length?'8px':'0')+'"><b>'+_iesc(p.tech)+'</b> will lead your delivery.</div>':'')+
(chips.length?'<div style="display:flex;gap:6px;flex-wrap:wrap">'+chips.map(function(c){return '<span style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700">'+c+'</span>'}).join('')+'</div>':''));
}
if(typeof p.bl==='number'){
if(p.bl>0){
var how='';var pay=(it.resp&&it.resp.payment)||'';
if(pay==='check')how='You chose to pay by check at delivery.';
else if(pay==='card')how='We will call you to pay by credit card.';
else if(pay==='store')how='You chose to pay at the Aspen Spas store before delivery.';
h+=_card('\u{1F4B5} Balance at delivery','<div style="font-weight:800;font-size:17px;color:#BE4A2F">'+(typeof fmt==='function'?fmt(p.bl):('$'+p.bl))+'</div>'+(how?'<div style="font-size:12.5px;color:var(--ink-mid);margin-top:4px">'+how+'</div>':'<div style="font-size:12.5px;color:var(--ink-mid);margin-top:4px">Due at delivery.</div>'));
}else{
h+=_card('\u{1F4B5} Balance','<div style="font-weight:800;font-size:15px;color:#166534">\u2713 Paid in full \u2014 nothing due at delivery.</div>');
}}
return h}

function _portalReviewHtml(it){
var rv=it.review;
if(rv&&rv.stars){
return '<div style="background:var(--surface);border-radius:14px;padding:16px;margin-bottom:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)"><div style="font-size:20px">'+'\u2B50'.repeat(Math.max(1,Math.min(5,rv.stars)))+'</div><div style="font-weight:700;margin-top:4px">Thank you for your feedback!</div></div>'}
var h='<div id="pRevCard" style="background:var(--surface);border-radius:14px;padding:16px;margin-bottom:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)">';
h+='<div style="font-weight:800;font-size:15px;margin-bottom:8px">How was your delivery?</div>';
h+='<div style="display:flex;justify-content:center;gap:6px">';
for(var i=1;i<=5;i++)h+='<button onclick="_pStar('+i+')" style="background:none;border:none;font-size:28px;cursor:pointer;padding:2px">\u2B50</button>';
h+='</div></div>';
return h}

function _portalSubmittedHtml(it){
var when=it.submittedAt?new Date(it.submittedAt).toLocaleDateString():'';
var h='<div style="background:#e7f8f0;border:1px solid #a7e3c6;border-radius:14px;padding:18px;margin-bottom:14px;text-align:center"><div style="font-size:30px">\u2705</div><div style="font-weight:800;font-size:17px;color:#166534">We received your information'+(when?' \u00b7 '+_iesc(when):'')+'</div><div style="font-size:13px;color:#166534;margin-top:4px">Everything is on file \u2014 here is where your delivery stands:</div></div>';
h+=_portalStatusHtml(it);
try{if(it.resp)h+=_card('\u{1F4CB} What you sent us',_irespSummary(it))}catch(e){}
h+=_card('\u{1F4DE} Need to change something?','<div style="font-size:13.5px;line-height:1.6;color:var(--ink-slate)">Call Aspen Spas at <b>314-776-5050</b> and ask for <b>Celia (ext. 2)</b> \u2014 we are happy to help.</div>');
return h}

function _portalFormHtml(it){
let rq=it.requested||{},h='';
h+='<div style="background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)">'+
'<div style="font-size:15px">Hi'+(it.cust?' '+_iesc(String(it.cust).split(/[ ,]/)[0]):'')+',</div>'+
'<div style="color:var(--ink-slate);font-size:14px;line-height:1.5;margin-top:6px">We are getting ready for your '+_iesc(it.spa||'spa')+' delivery'+(it.date?' on '+_iesc(String(it.date).replace(/\s*(am|pm|all day)/i,'')):'')+'. Please complete the items below so the crew is fully prepared. It only takes a couple of minutes.</div></div>';
h+=_portalStatusHtml(it);

if(rq.access)h+=_card('&#128205; Access photos','<div style="font-size:13px;color:var(--ink-slate);line-height:1.55;margin-bottom:10px">Please take photos showing the <b>full path</b> our crew will use to bring the spa in:<br>1) The <b>entrance / driveway</b> to your property<br>2) The <b>path or walkway</b> from the entrance to where the spa will go (gates, steps, slopes, tight spots)<br>3) The <b>patio / pad</b> where the spa will sit<br>4) The <b>surrounding area</b> &mdash; anything that affects access</div>'+_photoField('access','Add as many as needed so we can see the whole route from the street to the spot.'));

if(rq.level)h+=_card('&#128208; Level surface','<label style="display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--ink-strong);margin-bottom:12px;cursor:pointer"><input type="checkbox" onchange="_PORTAL.levelOk=this.checked" style="width:20px;height:20px;margin-top:1px"><span>The pad / patio where the spa will sit is <b>solid and level</b>, with nothing in the way.</span></label>'+_photoField('levelPhotos','Add a photo of the pad / patio where the spa will be placed.'));

if(rq.wip)h+=_card('&#128268; Wiring (WIP)','<div style="background:var(--st-warning-soft);border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:13px;color:#92400e;line-height:1.5;margin-bottom:10px">Please have ready before delivery: <b>15 ft of conduit / whip cable</b> and the <b>adapters</b> needed to connect the spa.</div><label style="display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--ink-strong);margin-bottom:12px;cursor:pointer"><input type="checkbox" onchange="_PORTAL.wipOk=this.checked" style="width:20px;height:20px;margin-top:1px"><span>I have the <b>15 ft conduit + adapters</b> ready.</span></label>'+_photoField('wipPhotos','Optional: add a photo of the conduit / whip run if you have it.'));

if(rq.electricity)h+=_card('&#9889; Electrical panel','<div style="font-size:13px;color:var(--ink-slate);line-height:1.55;margin-bottom:10px">Please send a clear photo of your <b>breaker box / electrical panel</b> &mdash; with the cover open so the breakers are visible.</div>'+_photoField('electricity','Add a photo of the open breaker box.'));

if(rq.payment)h+=_card('&#128181; Remaining balance','<div style="font-size:13px;color:var(--ink-slate);margin-bottom:10px">How would you like to pay the remaining balance?</div>'+
['store|I will pay at the Aspen Spas store before delivery','card|Please call me to pay by credit card','check|I will pay by check at delivery'].map(o=>{let v=o.split('|')[0],l=o.split('|')[1];return '<label style="display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-strong);padding:8px 0;cursor:pointer"><input type="radio" name="ipay" onchange="_PORTAL.payment=\''+v+'\'" style="width:20px;height:20px"><span>'+l+'</span></label>'}).join(''));

h+=_card('&#128221; Anything else? (optional)','<textarea id="intakeNotes" oninput="_PORTAL.notes=this.value" placeholder="Gate codes, dogs, parking, best times, etc." style="width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:14px;min-height:70px;font-family:inherit"></textarea>');

h+='<button type="button" onclick="submitIntake()" style="background:#15803d;color:#fff;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;width:100%;cursor:pointer;box-shadow:0 2px 6px rgba(21,128,61,.3)">Send Information</button>'+
'<div style="text-align:center;color:#94a3b8;font-size:12px;margin-top:10px">Aspen Spas &middot; This link closes once you submit.</div>';
return h}

function renderIntakePortal(id,token){
/* El id y el token se fijan AQUI, desde los argumentos de esta misma funcion.
   Antes solo los ponia el arranque, asi que cualquier otra ruta de entrada
   habria mandado cada POST con id y token vacios — un fallo silencioso. */
_PID=String(id||""); _PTOK=String(token||"");
document.title='Aspen Spas \u2014 Delivery Prep';
let lo=document.getElementById('loading-ov');if(lo)lo.remove();
let host=document.getElementById('intakePortalRoot');
if(!host){host=document.createElement('div');host.id='intakePortalRoot';host.style.cssText='position:fixed;inset:0;z-index:100000;overflow:auto;-webkit-overflow-scrolling:touch;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif';document.body.appendChild(host)}
host.innerHTML=_portalShell('<div style="text-align:center;color:var(--ink-mid);padding:40px">Loading\u2026</div>');
/* El token ya NO se comprueba aqui: lo valida el SERVIDOR antes de mandar
   nada. Antes se descargaba el nodo entero y se comparaba despues, en JS —
   y como los ids de ticket son Date.now(), eso permitia leer nombre, spa,
   fecha de entrega y SALDO a quien acertara el id sin saber el token. */
fetch(PORTAL_GET_FN+"?id="+encodeURIComponent(id)+"&t="+encodeURIComponent(token))
.then(function(r){return r.json()})
.then(function(j){
if(!j||j.ok!==true){
  host.innerHTML=(j&&j.error==="expired")
    ? _portalMsg('This link has expired','Give Aspen Spas a call and we will send you a fresh one.')
    : _portalMsg('Link not valid','This link is invalid or has expired. Please contact Aspen Spas.');
  return}
var it=j.intake;
if(it.submitted){document.title='Aspen Spas \u2014 Your Delivery';_PORTAL={id:id,it:it};host.innerHTML=_portalShell(_portalSubmittedHtml(it));return}
_PORTAL={id:id,it:it,access:[],levelPhotos:[],electricity:[],wipPhotos:[],levelOk:false,wipOk:false,payment:'',notes:''};
host.innerHTML=_portalShell(_portalFormHtml(it));
}).catch(function(e){console.error('[PORTAL] load',e);host.innerHTML=_portalMsg('We could not open your form','Check your signal and reload the page. If it keeps happening, call Aspen Spas.')})}

async function intakeFiles(input,group){
let files=Array.from(input.files||[]);if(!files.length)return;
let btn=input.previousElementSibling;
for(let f of files){
if(_PORTAL[group].length>=10){showToast&&showToast('Max 10 photos per section','warn');break}
try{let b64=await compressImage(f,1100,0.6);
// Try Firebase Storage first (tiny URL in the ticket instead of a multi-MB base64 blob).
// Falls back to inline base64 if Storage is off/blocked — exactly the old behavior.
let _tid=(_PORTAL&&_PORTAL.id)||'portal'; /* BUGFIX 2026-07-21: _PORTAL.it has no i/id field, so EVERY customer's photos uploaded to the shared 'portal' folder; the ticket id lives at _PORTAL.id */
let stored=await uploadPhotoToStorage('intake_'+_tid,b64);
if(!/^https?:/.test(stored)&&stored.length>1100000){alert('That photo is too large even after shrinking — please try a smaller one.');continue}
_PORTAL[group].push(stored)}catch(e){console.error('compress',e);alert("We couldn't read one of your photos. If you're on an iPhone, open it in Photos, tap Share, choose \"Save as File\" (it saves as JPG), then upload that — or change Settings → Camera → Formats to \"Most Compatible\".")}
}
input.value='';_intakeThumbs(group)}

function submitIntake(){
let it=_PORTAL.it,rq=it.requested||{},miss=[];
if(rq.access&&!_PORTAL.access.length)miss.push('access photos');
if(rq.level){if(!_PORTAL.levelOk)miss.push('confirm the pad is level');if(!_PORTAL.levelPhotos.length)miss.push('a photo of the pad');}
if(rq.wip&&!_PORTAL.wipOk)miss.push('confirm the 15ft conduit + adapters are ready');
if(rq.electricity&&!_PORTAL.electricity.length)miss.push('a photo of the breaker box');
if(rq.payment&&!_PORTAL.payment)miss.push('how you will pay the balance');
if(miss.length){alert('Before sending, please add:\n\n\u2022 '+miss.join('\n\u2022 '));return}
let resp={};
if(rq.access)resp.access=_PORTAL.access;
if(rq.level){resp.levelOk=_PORTAL.levelOk;resp.levelPhotos=_PORTAL.levelPhotos}
if(rq.wip){resp.wipOk=_PORTAL.wipOk;if(_PORTAL.wipPhotos.length)resp.wipPhotos=_PORTAL.wipPhotos}
if(rq.electricity)resp.electricity=_PORTAL.electricity;
if(rq.payment)resp.payment=_PORTAL.payment;
if(_PORTAL.notes)resp.notes=_PORTAL.notes;
let host=document.getElementById('intakePortalRoot');
if(host)host.innerHTML=_portalShell('<div style="text-align:center;color:var(--ink-mid);padding:40px">Sending\u2026</div>');
let id=_PORTAL.id;
pPost({kind:"final",resp:resp}).then(function(){
_PORTAL.it.resp=resp;_PORTAL.it.submitted=true;_PORTAL.it.submittedAt=Date.now();if(host)host.innerHTML=_portalShell(_portalSubmittedHtml(_PORTAL.it));
}).catch(e=>{console.error('[INTAKE] submit',e);if(host)host.innerHTML=_portalMsg('Could not send','Please check your connection and try again, or contact Aspen Spas.')})}
/* ---------------------------- fin del portal --------------------------- */

/* Arranque. Las reglas de la base piden sesion (auth != null), asi que se
   entra en anonimo igual que hace el app; si eso falla se avisa en vez de
   quedarse en blanco para siempre. */
(function boot(){
  var p=getIntakeParams();
  var boot=document.getElementById('bootMsg');
  function fail(t,m){
    document.body.innerHTML='';
    var d=document.createElement('div');
    d.innerHTML=_portalShell(_portalMsg(t,m));
    document.body.appendChild(d);
  }
  if(!p||!p.id||!p.token){
    return fail('Link not valid',
      'Please open the exact link we sent you, or call Aspen Spas and we will send a new one.');
  }
  /* Nada de signInAnonymously: aqui ya no hay Firebase que iniciar. */
  _PID=p.id; _PTOK=p.token;
  if(boot)boot.remove();
  renderIntakePortal(p.id,p.token);
})();
</script>
